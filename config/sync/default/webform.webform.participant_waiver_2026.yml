elements: |-
  waiver_content:
    '#type': webform_markup
    '#markup': '<p style="margin-bottom:2.0pt;text-align:center;" align="center"><span style="color:#333333;font-size:14.0pt;"><strong>Participant Waiver and Release of Liability</strong></span></p><p style="margin-bottom:20.0pt;text-align:center;" align="center"><em><span style="color:#666666;">[Event Date] • [Location]</span></em></p><div style="border-bottom:solid #AAAAAA 1.0pt;border:none;padding:0in 0in 1.0pt 0in;"><p style="border:none;margin-bottom:12.0pt;padding:0in;">&nbsp;</p></div><p style="margin-bottom:8.0pt;"><span style="color:#CC0000;"><strong>PLEASE READ THIS DOCUMENT CAREFULLY BEFORE SIGNING. BY PARTICIPATING IN THIS EVENT, YOU AGREE TO BE BOUND BY THE TERMS BELOW.</strong></span></p><p style="margin-bottom:12.0pt;">This Waiver and Release of Liability ("Waiver") is entered into between the undersigned participant ("Participant") and [Race Organization Name], its directors, officers, employees, volunteers, sponsors, agents, and affiliated entities (collectively, "Race Organizers"), in connection with participation in [Race Name] (the "Event").</p><h2>1. Acknowledgment of Inherent Risks</h2><p style="margin-bottom:8.0pt;">Participant acknowledges that participation in trail running, road racing, and endurance events involves inherent risks, including but not limited to:</p><ul style="margin-left:8px;"><li data-list-item-id="ef7614a06617154f7f1bd6fce8f0ae03a"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Physical exertion leading to exhaustion, dehydration, heat stroke, hypothermia, or cardiac events;</p></li><li data-list-item-id="e8ca86756de0b99114721051d694593fb"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Trips, falls, and collisions with terrain features, other participants, vehicles, or wildlife;</p></li><li data-list-item-id="eccc2360fa35690a465c635a4c552b76d"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Exposure to extreme weather conditions, uneven or unstable trail surfaces, and remote locations;</p></li><li data-list-item-id="ec2a535689ce05174bda73ac3b0e2bef0"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Animal encounters, insect stings, and contact with poisonous plants;</p></li><li data-list-item-id="ef46db8df5c79502e3d13907c3895adeb"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Inadequate lighting, visibility, or signage;</p></li><li data-list-item-id="e45de834a198390d7d96aad9df29739ea"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Equipment failure;</p></li><li data-list-item-id="ebc47475ed89b04538f85b092d2f94400"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Delayed or limited access to medical care due to remote race conditions;</p></li><li data-list-item-id="ebef6dc1db9b32f6842440e118b347cca"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Any other risks inherent to participation in outdoor endurance athletics.</p></li></ul><p style="margin-bottom:12.0pt;margin-left:0in;margin-right:0in;margin-top:8.0pt;">Participant fully accepts these risks as a condition of participation.</p><h2>2. Commitment to Personal Safety</h2><p style="margin-bottom:8.0pt;">Participant agrees to:</p><ul style="margin-left:8px;"><li data-list-item-id="ebc1adbdd783c3bd07a682ba6247c56d0"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Compete only if physically fit and medically cleared to participate in strenuous athletic activity;</p></li><li data-list-item-id="edd31a0fd604eb01fe2cc0b2a1575c1c8"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Carry all required mandatory gear as specified in the race rules;</p></li><li data-list-item-id="e36478416613069a84d3c53ded5687aeb"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Adhere to all race rules, course markings, and instructions from race officials and volunteers;</p></li><li data-list-item-id="ecab03ba11f6d0858fc4acfb4a57f6415"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Withdraw from the race and seek assistance if experiencing symptoms of injury, illness, or distress;</p></li><li data-list-item-id="e7e7247c66ccaf33ef65147d7de554dd8"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Conduct themselves in a manner that does not endanger other participants, volunteers, or bystanders;</p></li><li data-list-item-id="e45917f7f36fd7124ef0b06f464bdd5b5"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Be responsible for their own hydration, nutrition, and pacing strategy throughout the event.</p></li></ul><p style="margin-bottom:12.0pt;">&nbsp;</p><h2>3. Race Organizer Commitments</h2><p style="margin-bottom:8.0pt;">Race Organizers will make reasonable efforts to provide a safe event environment, including:</p><ul style="margin-left:8px;"><li data-list-item-id="e5da4e1e9a5aa8e74ee6fa79f38a3d45b"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Course marking, pre-race safety briefings, and communication of known hazards;</p></li><li data-list-item-id="e8814aa46f0e2c6e897aaa06f3ed50e02"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Aid stations staffed with trained personnel and basic medical supplies;</p></li><li data-list-item-id="ea743e2eaa86cfbe3b804a8d6dfa5ddc9"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Emergency response coordination and communication protocols;</p></li><li data-list-item-id="ee9419fa8da9878597d1e160b818dcb11"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Volunteer and staff training on participant safety and emergency procedures.</p></li></ul><p style="margin-bottom:12.0pt;margin-left:0in;margin-right:0in;margin-top:8.0pt;">Participant understands that, despite these efforts, Race Organizers cannot guarantee a risk-free environment. Conditions may change rapidly and without notice, and hazards may exist that are not foreseeable or preventable.</p><h2>4. Release of Liability</h2><p style="margin-bottom:8.0pt;">In consideration of being permitted to participate in the Event, Participant, for themselves, their heirs, executors, administrators, legal representatives, and assigns, hereby RELEASES, WAIVES, DISCHARGES, and COVENANTS NOT TO SUE the Race Organizers from any and all claims, demands, losses, damages, causes of action, or liability of any kind, whether arising from negligence or otherwise, for any injury (including death), illness, loss, or damage to person or property, arising out of or in connection with:</p><ul style="margin-left:8px;"><li data-list-item-id="e11e87537bbdb6cf49d36c197cd43a05f"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Participation in the Event;</p></li><li data-list-item-id="e44cb211bb4521c1c50612e66680eb4bc"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Travel to or from the Event;</p></li><li data-list-item-id="e1779507ab7fed040e519f8664063e94e"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Use of race facilities, equipment, or course;</p></li><li data-list-item-id="ee0f146bd93a863eab5ed7082082aff75"><p style="margin-bottom:4.0pt;margin-right:0in;margin-top:0in;">Actions or omissions of Race Organizers, volunteers, other participants, or third parties.</p></li></ul><p style="margin-bottom:12.0pt;margin-left:0in;margin-right:0in;margin-top:8.0pt;">This release applies to claims based on negligence, gross negligence, breach of contract, and any other legal theory, to the fullest extent permitted by applicable law.</p><h2>5. Indemnification</h2><p style="margin-bottom:12.0pt;">Participant agrees to indemnify, defend, and hold harmless the Race Organizers from any claims, costs, expenses (including reasonable attorneys’ fees), or liability arising from Participant’s actions or omissions during the Event, including harm caused to third parties.</p><h2>6. Medical Authorization</h2><p style="margin-bottom:12.0pt;">Participant consents to receive emergency medical treatment if, in the judgment of event medical personnel or race officials, such treatment is necessary. Participant agrees to bear all costs associated with such treatment and releases Race Organizers from any liability related to emergency medical care.</p><h2>7. Assumption of Responsibility</h2><p style="margin-bottom:12.0pt;"><strong>Participant understands and agrees that their safety is ultimately their own responsibility. Participant assumes full and sole responsibility for any and all risks of injury, illness, death, or property damage arising from participation in the Event, whether or not such risks were foreseeable at the time of signing this Waiver.</strong></p><h2>8. Photo and Media Release</h2><p style="margin-bottom:12.0pt;">Participant grants Race Organizers the right to use photographs, video, and other media captured during the Event for promotional and non-commercial purposes, without compensation.</p><h2>9. Severability and Governing Law</h2><p style="margin-bottom:12.0pt;">If any provision of this Waiver is found to be unenforceable, the remaining provisions shall remain in full force and effect. This Waiver shall be governed by the laws of the State of [State].</p><div style="border-bottom:solid #AAAAAA 1.0pt;border:none;padding:0in 0in 1.0pt 0in;"><p style="border:none;margin-bottom:12.0pt;margin-left:0in;margin-right:0in;margin-top:12.0pt;padding:0in;">&nbsp;</p></div><p style="margin-bottom:8.0pt;"><span style="color:#1A1A1A;font-size:12.0pt;"><strong>PARTICIPANT ACKNOWLEDGMENT</strong></span></p><p style="margin-bottom:20.0pt;"><em>I have read this Waiver in its entirety, understand its contents, and agree to be bound by its terms. I am 18 years of age or older (or the parent/legal guardian of the minor named below has signed on their behalf). I sign this Waiver voluntarily and of my own free will.</em></p>'
  signature:
    '#type': webform_signature
    '#title': Signature
    '#description': '<p>Sign above</p>'
    '#uri_scheme': private
    '#required': true
