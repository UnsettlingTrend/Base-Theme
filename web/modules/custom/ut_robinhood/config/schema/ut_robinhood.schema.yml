ut_robinhood.settings:
  type: config_object
  label: 'UT Robinhood Settings'
  mapping:
    cron_interval:
      type: integer
      label: 'Cron import interval (seconds)'
    order_states:
      type: sequence
      label: 'Allowed order states to import'
      sequence:
        type: string
        label: 'State'
    update_existing:
      type: boolean
      label: 'Update existing orders on re-import'
    import_limit:
      type: integer
      label: 'Max orders to process per cron run (0 = unlimited)'
    bridge_script_path:
      type: string
      label: 'Absolute path to the Python bridge script'
    pickle_dir:
      type: string
      label: 'Directory for the robin_stocks auth pickle file'
