unsettling_trend.config:
      path: '/admin/config/unsettling'
      defaults:
        _controller: '\Drupal\system\Controller\SystemController::systemAdminMenuBlockPage'
        _title: 'Unsettling Trend'
      requirements:
        _permission: 'administer site configuration'

unsettling_blocks.config:
  path: '/admin/config/unsettling/settings'
  defaults:
    _form: '\Drupal\unsettling_blocks\Controller\UnsettlingSettingsForm'
    _title: 'Unsettling Blocks Configuration'
  requirements:
    _permission: 'administer site configuration'







