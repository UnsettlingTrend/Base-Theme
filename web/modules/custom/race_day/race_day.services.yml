services:
  race_day.waiver_gate_subscriber:
    class: Drupal\race_day\EventSubscriber\WaiverGateSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@current_route_match'
    tags:
      - { name: event_subscriber }

  race_day.csv_service:
    class: Drupal\race_day\Service\RaceLegCsvService
    arguments:
      - '@entity_type.manager'

  race_day.group_page_access_check:
    class: Drupal\race_day\Access\GroupPageAccessCheck
    tags:
      - { name: access_check, applies_to: _race_day_group_page_access }

  race_day.route_subscriber:
    class: Drupal\race_day\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  race_day.team_live_map_breadcrumb:
    class: Drupal\race_day\Breadcrumb\TeamLiveMapBreadcrumbBuilder
    tags:
      # Higher than easy_breadcrumb's 1003 (easy_breadcrumb.services.yml) so
      # this wins on race_day.team_live_map specifically — applies() there
      # is scoped to that one route, so it has no effect anywhere else.
      - { name: breadcrumb_builder, priority: 1010 }

  race_day.drush_commands:
    class: Drupal\race_day\Drush\Commands\RaceDayCommands
    arguments:
      - '@race_day.csv_service'
    tags:
      - { name: drush.command }
