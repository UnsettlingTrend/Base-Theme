# ctools entity_view block does not declare view_mode in its schema; fill the
# gap here so layout_builder config validation passes cleanly.
block.settings.entity_view:*:
  type: block_settings
  label: 'Entity view block settings'
  mapping:
    view_mode:
      type: string
      label: 'View mode'

race_day.settings:
  type: config_object
  label: 'Race Day settings'
  mapping:
    location_update_interval:
      type: integer
      label: 'Location update interval in seconds'
    map_provider:
      type: string
      label: 'Map tile provider URL'
    allow_public_registration:
      type: boolean
      label: 'Allow public team registration'

