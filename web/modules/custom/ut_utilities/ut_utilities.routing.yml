ut_utilities.user.areas_of_interest:
  path: '/user/{user}/areas-of-interest'
  defaults:
    _form: '\Drupal\ut_utilities\Form\AreasOfInterestForm'
    _title: 'Areas of Interest'
  requirements:
    _entity_access: 'user.update'
    user: \d+
  options:
    parameters:
      user:
        type: entity:user

# --------------------------------------------------------------------------
# Mobile app authentication. Deliberately anonymous-reachable: the whole
# point of this route is resolving (or creating) a Drupal account from a
# Google ID token — there's no Drupal credential to gate on yet for a
# first-time sign-in. The token itself, verified inside the controller, IS
# the credential; HTTPS is still enforced since it's sent on the wire. The
# Bearer token this issues is later validated by Authentication\ApiTokenAuth
# on whichever app API endpoints require it (see e.g. ut_tracking.routing.yml).
# --------------------------------------------------------------------------

ut_utilities.google_login:
  path: '/api/app/google-login'
  defaults:
    _controller: '\Drupal\ut_utilities\Controller\AppAuthController::googleLogin'
  requirements:
    _access: 'TRUE'
    _custom_access: '\Drupal\ut_utilities\Access\SecureRequestAccessCheck::access'
  methods: [POST]
  options:
    _format: json
