services:
  ut_utilities.google_id_token_verifier:
    class: Drupal\ut_utilities\GoogleIdTokenVerifier
    arguments: ['@http_client', '@cache.default']

  ut_utilities.api_token_auth:
    class: Drupal\ut_utilities\Authentication\ApiTokenAuth
    arguments: ['@database']
    tags:
      - { name: authentication_provider, provider_id: 'ut_utilities_api_token', priority: 100 }
