# The name of this app. Must be unique within a project.
name: cf

# The runtime the application uses. The 'type' key defines the base container
# image that will be used to run the application. There is a separate base
# container image for each primary language for the application,
# in multiple versions. Check the PHP documentation
# (https://docs.platform.sh/languages/php.html#supported-versions)
# to find the supported versions for the 'php' type.
type: 'php:8.3'

variables:
  env:
    # Update these for your desired NVM and Node versions.
    NVM_VERSION: v0.40.3
    NODE_VERSION: v22.11.0

dependencies:
  php:
    composer/composer: '^2.1'

# The following block defines a single writable directory, 'web/uploads'
# The 'source' specifies where the writable mount is. The 'local' source
# indicates that the mount point will point to a local directory on the
# application container. The 'source_path' specifies the subdirectory
# from within the source that the mount should point at.
# The 'mounts' describe writable, persistent filesystem mounts in the application.
mounts:
  # The default Drupal files directory.
  '/web/sites/default/files':
    source: local
    source_path: 'files'
  # Drupal gets its own dedicated tmp directory. The settings.platformsh.php
  # file will automatically configure Drupal to use this directory.
  '/tmp':
    source: local
    source_path: 'tmp'
  # Private file uploads are stored outside the web root. The settings.platformsh.php
  # file will automatically configure Drupal to use this directory.
  '/private':
    source: local
    source_path: 'private'
  # Storage location for PHP and Twig Template related files.
  '/storage':
    source: local
    source_path: 'storage'
  # Drush needs a scratch space for its own caches.
  '/.drush':
    source: local
    source_path: 'drush'
  # Drush will try to save backups to this directory, so it must be
  # writeable even though you will almost never need to use it.
  '/drush-backups':
    source: local
    source_path: 'drush-backups'
  # Drupal Console will try to save backups to this directory, so it must be
  # writeable even though you will almost never need to use it.
  '/.console':
    source: local
    source_path: 'console'

# The size of the persistent disk of the application (in MB).
disk: 512

# Configuration of the build of this application.
build:
  # Automatically run `composer install` on every build.
  flavor: composer

# The hooks executed at various points in the lifecycle of the application.
hooks:
  build: |
    set -e
    unset NPM_CONFIG_PREFIX

    export NVM_DIR="${PLATFORM_APP_DIR}/.nvm"
    NVM_INSTALL_FILE="/tmp/nvm_${NVM_VERSION}_install.sh"
    NVM_URL="https://raw.githubusercontent.com/nvm-sh/nvm/${NVM_VERSION}/install.sh"

    # Install nvm in app dir (no cache/symlink logic).
    if [ ! -s "${NVM_DIR}/nvm.sh" ]; then
      if command -v curl >/dev/null 2>&1; then
        curl -fsSL "${NVM_URL}" -o "${NVM_INSTALL_FILE}"
      else
        wget -q -O "${NVM_INSTALL_FILE}" "${NVM_URL}"
      fi
      bash "${NVM_INSTALL_FILE}"
    fi

    # nvm.sh is not consistently nounset-safe under /bin/dash with set -u.
    # Run nvm activation and version selection in bash with -e only.
    bash -ec '
      . "${NVM_DIR}/nvm.sh"
      nvm install "${NODE_VERSION}"
      nvm use "${NODE_VERSION}"
    '

    build_theme() {
      theme_dir="$1"
      echo "Compiling assets in ${theme_dir}..."
      (
        cd "${theme_dir}"
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        npm run build --if-present
        rm -rf node_modules
      )
    }

    echo "Preparing theme files..."
    build_theme "${PLATFORM_APP_DIR}/web/themes/contrib/material_base"
    build_theme "${PLATFORM_APP_DIR}/web/themes/custom/ut_material"
    echo "Finished compiling all theme assets."


  # The deploy hook runs after your application has been deployed and started.
  # Code cannot be modified at this point but the database is available.
  # The site is not accepting requests while this script runs so keep it
  # fast.
  deploy: |
    set -e
    cd web
    ../vendor/bin/drush -y cache-rebuild
    ../vendor/bin/drush -y deploy

# The relationships of the application with services or other applications.
#
# The left-hand side is the name of the relationship as it will be exposed
# to the application in the PLATFORM_RELATIONSHIPS variable. The right-hand
# side is in the form '<service name>:<endpoint name>'.
relationships:
  database: 'db:production'
  search:
    service: search
    endpoint: solr

web:
  locations:
    '/':
      root: "web"
      passthru: "/index.php"

# Workers require a medium plan on upsun
#workers:
#  queue:
#    commands:
#      start: 'cd /app ; vendor/bin/drush queue:worker --time-limit=60'

crons:
  # Run Drupal's cron tasks every 19 minutes.
  drupal:
    spec: '*/19 * * * *'
    cmd: 'cd /app ; vendor/bin/drush core-cron'
