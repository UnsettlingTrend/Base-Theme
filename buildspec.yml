version: 0.1

phases:
  install:
    commands:
      - php -v
      - lsb_release -a
      - echo Install started
      - echo `pwd`
      - cd ..
      - echo `pwd`
      - sudo add-apt-repository ppa:ondrej/php
      - sudo apt-get update
      # Add missing php extensions...
      - sudo apt-get install -y libpng-dev
      - sudo apt-get install -y --force-yes php7.1-gd php7.1-mbstring
#      - npm install bower -g
#      - npm install grunt -g
      - echo Installing nodejs and npm...
      - curl -sL https://deb.nodesource.com/setup_10.x | sudo -E bash -
      - sudo apt-get install -y nodejs
      - npm -v
#      - sudo apt-get install -y npm
      - echo Installing gulp and downloading node_modules...
#      - npm install gulp -g
#      - npm install gulp-cli -g
      - npm install
#      - bower install --allow-root
      - echo Running composer install to add contrib modules and libraries...
      - composer install
      - echo Install finished
  pre_build:
    commands:
      - echo Pre-Build started
      - echo Pre-Build finished
  build:
    commands:
      - echo Build started
      - echo Running gulp...
      - gulp
      - echo Build finished
  post_build:
    commands:
      - echo Post-Build started
      - echo Post-Build finished
artifacts:
  files:
    - index.html
    - appspec.yml