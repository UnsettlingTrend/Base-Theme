version: 0.2    # This is important! Don't change from 0.2
phases:
  install:
    runtime-versions:
      php: 7.3
    commands:
      # Print the version of Linux
      - lsb_release -a

      # Avoid warnings/errors due to no interactive CLI
      - export DEBIAN_FRONTEND=noninteractive

      #Install php7.3
      - apt-get update
      #- apt-get install -y  software-properties-common
      #- LC_ALL=C.UTF-8 add-apt-repository -y ppa:ondrej/php
      #- apt-get update
      - php --version
      - apt-get install -y php-ldap php-xml php-xmlrpc php-zip php-mysql php-mbstring php-gd php-readline php-opcache php-xdebug php-dom php-xdebug php-curl unzip
      #- php --version

      #Enable xdebug - phpunit uses this for code coverage
      - phpenmod xdebug

      #Install composer and gulp
      - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      - php composer-setup.php ;
      - php -r "unlink('composer-setup.php');" ;
      - mv composer.phar /usr/local/bin/composer
      - npm install -g gulp

      # Start Mysql
      - apt-get install -y mysql-server
      - su mysql -s /bin/bash -c "/usr/sbin/mysqld" &
  build:
    commands:
      - php -v
      - echo Build started on `date`
      - echo Installing composer deps
      - composer install --no-progress --no-suggest
      - npm -v
      - echo Installing nodejs deps
      - npm install
      # Do you need to do this? In many cases phpunit will use sqllite or similar to avoid the need for a real DB.
      # If you don't need it delete it
      # - /usr/bin/mysql  -u root -e "GRANT ALL ON *.* TO 'test'@'localhost' IDENTIFIED BY '' WITH GRANT OPTION"
      # - mysqladmin -u test create test
      - ./vendor/bin/phpunit
  post_build:
    commands:
      - echo Build completed on `date`
      - tar -czf build.tar web config
artifacts:
  files:
    - build.tar
    - scripts/aws/*
    - appspec.yml