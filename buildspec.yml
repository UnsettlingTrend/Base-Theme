version: 0.2

phases:
  install:
    commands:
      - echo Build started on `date`
      - echo Installing gulp...
      - npm install --global gulp-cli
  build:
    commands:
      - echo Running composer...
      - composer update
      - echo Running gulp...
      - gulp
  post_build:
    commands:
      - echo Packaging up the code...
      - echo Build completed on `date`
artifacts:
  files:
    - appspec.yml