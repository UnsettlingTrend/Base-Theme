version: 0.2    # This is important! Don't change from 0.2
phases:
  install:
    runtime-versions:
      php: 7.4
      nodejs: 14.x
    commands:
  pre_build:
    commands:
      bash scripts/aws/codebuild_pre_build.sh
  build:
    commands:
      bash scripts/aws/codebuild_build.sh
  post_build:
    commands:
      bash scripts/aws/codebuild_post_build.sh
artifacts:
  files:
    - build.tar
    - scripts/aws/*
    - appspec.yml
