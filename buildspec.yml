version: 0.2

phases:
  build:
    commands:
      - echo Build started on `date`
  post_build:
    commands:
      - echo Packaging up the code
      - pwd
      - ls -la
      - touch test.md
      - echo Executed at `date`... >> test.md
      - echo Build completed on `date`
artifacts:
  files:
    - test.md
    - appspec.yml