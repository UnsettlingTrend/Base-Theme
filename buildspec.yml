version: 0.1

phases:
  install:
    commands:
      - echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
      - sudo apt-get install -y -q
      - php -v
      - lsb_release -a
      - echo Install started
      - echo `pwd`
      # Add any necessary repositories
      - sudo add-apt-repository ppa:ondrej/php  # Needed for php7.1 extensions
      - sudo apt-get update
      # Add missing php extensions...
      - sudo apt-get install -y --force-yes php7.1-gd php7.1-mbstring
      # - sudo service httpd restart  # Restart Apache server for extensions to take affect
      - echo Installing nodejs and npm...
      - curl -sL https://deb.nodesource.com/setup_10.x | sudo -E bash -
      - sudo apt-get install -y --force-yes nodejs
      - npm -v
      - echo Installing gulp and downloading node_modules...
      - npm install
      - echo Running composer install to add contrib modules and libraries...
      - composer install
      - echo Install finished
  pre_build:
    commands:
      - echo Pre-Build started
      - echo Pre-Build finished
  build:
    commands:
      - echo Build started
      - echo Running gulp...
      - gulp
      - echo Build finished
  post_build:
    commands:
      - echo Post-Build started
      - echo Post-Build finished
artifacts:s
  files:
    - index.html
    - appspec.yml