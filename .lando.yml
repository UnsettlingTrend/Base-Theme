name: cf
recipe: drupal8

config:
  php: 7.2
  via: apache
  webroot: web
  xdebug: false
  conf:
    dev/php: php.ini
    dev/mysql: my.cnf

services:
  database:
    type: mysql:5.7
  pma:
    type: phpmyadmin
    hosts:
      - database
  appserver:
    composer:
      phpunit/phpunit: '*'
      behat/behat: 3.3.1
    run:
      - "ln -s /usr/local/bin/composer /usr/local/bin/composer.phar"
    run_as_root:
      - "bash /app/lando/scripts/build.sh"
  node:
    type: node:6.10
    globals:
      gulp-cli: latest
    build:
      - "cd $LANDO_MOUNT && npm install"
#  Leaving this here for now, as an example of how to use other docker images
#  compass:
#    type: compose
#    services:
#      image: antonienko/compass-watch
#      command: watch --poll /src/compass
#    description: run compass- use lando compass

tooling:
  phpunit:
    service: appserver
    description: run PHPUnit- use lando phpunit
  behat:
    service: appserver
    description: run behat- use lando behat
    cmd: cd /app ; behat  # Run behat from the /app  directory
  node:
    service: node
  npm:
    service: node
  gulp:
    service: node