# TODO Fix PHPUnit testing of only custom themes/modules
# TODO Look into Portainer

name: cf
recipe: drupal9

env_file:
 - lando/defaults.env

config:
  composer_version: 2
  via: apache
  webroot: web
  xdebug: true
  config:
    php: lando/config/php.ini
    mysql: lando/config/my.cnf
    # This is done purely to fix an issue with mysql 8
    database: lando/my_custom.cnf

proxy:
  search:
    - search.cf.lndo.site
  pma:
    - db.cf.lndo.site
  mailhog:
    - mail.cf.lndo.site

services:
  search:
    type: solr:8.4
    portforward: true
    core: collection1
    config:
      dir: config/solr-conf
  database:
    type: mysql:8.0.32
  #    portforward: 3310
  pma:
    type: phpmyadmin
    hosts:
      - database
  appserver:
    type: php:8.1
    composer:
      behat/behat: 3.3.1
    overrides:
      environment:
        DRUSH_OPTIONS_URI: "https://cf.lndo.site"
        # support debugging Drush with XDEBUG.
        PHP_IDE_CONFIG: "serverName=appserver"
        LANDO_HOST_IP: "host.docker.internal"
        XDEBUG_CONFIG: "remote_enable=1 remote_host=host.docker.internal"
    build:
      - "/app/vendor/bin/phpcs --config-set installed_paths /app/vendor/drupal/coder/coder_sniffer"
    run_as_root:
#      - "apt-get install python3-pip"
#      - "pip3 install robin_stocks"
      - "bash /app/lando/scripts/build.sh"
  node:
    type: node:16
    globals:
      gulp-cli: latest
    build:
      - "cd $LANDO_MOUNT && npm install -y"
  mailhog:
    type: mailhog
    hogfrom:
      - appserver
    portforward: true

tooling:
  composer:
    service: appserver
    description: run composer commands
    cmd: /usr/local/bin/composer
  drupal:
    service: appserver
    description: Runs Drupal console
    cmd: /app/vendor/bin/drupal
    user: www-data
  phpunit:
    service: appserver
    description: Runs phpunit with config at web/sites/default/local.phpunit.xml
    cmd: /app/vendor/bin/phpunit -v -c /app/web/sites/default/local.phpunit.xml
  phpcs:
    service: appserver
    cmd: "php --standard=Drupal,DrupalPractice --extensions=php,module,inc,install,test,profile,theme,css,info,txt,md,yml"
  behat:
    service: appserver
    description: run behat- use lando behat
    cmd: cd /app ; behat  # Run behat from the /app directory
  node:
    service: node
  npm:
    service: node
  gulp:
    service: node
  xdebug-on:
    service: appserver
    description: Enable xdebug for apache.
    cmd: docker-php-ext-enable xdebug && /etc/init.d/apache2 reload
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for apache.
    cmd: rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload
    user: root
