# TODO Fix PHPUnit testing of only custom themes/modules
# TODO Look into Portainer

name: cf
recipe: drupal8

env_file:
  - lando/lando.env

config:
  php: 7.4
  via: apache
  webroot: web
  xdebug: true
  config:
    php: lando/config/php.ini
    mysql: lando/config/my.cnf

proxy:
  pma:
    - db-cf.lndo.site
  mailhog:
    - mail-cf.lndo.site

services:
  database:
    type: mysql:5.7
  #    portforward: 3310
  pma:
    type: phpmyadmin
    hosts:
      - database
  appserver:
    composer:
      phpunit/phpunit: '*'
      behat/behat: 3.3.1
    run:
      - "ln -s /usr/local/bin/composer /usr/local/bin/composer.phar"
    run_as_root:
      - "bash /app/lando/scripts/build.sh"
    overrides:
      environment:
        DRUSH_OPTIONS_URI: "https://cf.lndo.site"  # TODO Get this out of this file, but it doesn't seem to work in .lando.base.yml
  node:
    type: node:10
    globals:
      gulp-cli: latest
    build:
      - "cd $LANDO_MOUNT && npm install"
  mailhog:
    type: mailhog
    hogfrom:
      - appserver
    portforward: true

tooling:
  drush:
    service: appserver
    description: run drush commands
    cmd: /app/vendor/drush/drush/drush
  phpunit:
    service: appserver
    description: run PHPUnit- use lando phpunit
  behat:
    service: appserver
    description: run behat- use lando behat
    cmd: cd /app ; behat  # Run behat from the /app  directory
  node:
    service: node
  npm:
    service: node
  gulp:
    service: node