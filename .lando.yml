name: cf
recipe: drupal8

config:
  php: 7.2
  via: apache
  webroot: web
  xdebug: false
  conf:
    dev/php: php.ini
    dev/mysql: my.cnf

services:
  database:
    type: mysql:5.7
    portforward: 3325
  pma:
    type: phpmyadmin
    hosts:
      - database
  appserver:
    composer:
      phpunit/phpunit: '*'
      behat/behat: 3.3.1
  node:
    type: node:6.10
    globals:
      gulp-cli: latest
    build:
      - "cd $LANDO_MOUNT && npm install"

tooling:
  phpunit:
    service: appserver
    description: run PHPUnit- use lando phpunit
  behat:
    service: appserver
    description: run behat- use lando behat
  node:
    service: node
  npm:
    service: node
  gulp:
    service: node
