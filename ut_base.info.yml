name: 'UT Base'
type: theme
description: 'Neutral Material Base (MDC) starter theme for Trend personal sites.'
core_version_requirement: ^10 || ^11
screenshot: screenshot.svg

base theme: material_base_mdc

libraries:
  - ut_base/theme
  - ut_base/mdc

libraries-override:
  material_base/base:
    css:
      base:
        dist/css/base.css: false
  material_base/fonts: ut_base/fonts
  material_base_mdc/mdc:
    css:
      theme:
        ../../dist/css/mdc.css: false

components:
  namespaces:
    components: components

regions:
  navbar: 'Navbar'
  header: 'Header'
  actions: 'Actions'
  main_top: 'Main top'
  content_above: 'Content above'
  breadcrumb: 'Breadcrumb'
  messages: 'Messages'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  content_secondary: 'Content secondary'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  content_below: 'Content below'
  main_bottom: 'Main bottom'
  pre_footer: 'Pre-Footer'
  footer: 'Footer'
  drawer: 'Drawer'
  overlay: 'Overlay'

regions_hidden:
  page_bottom: 'Page bottom'
  page_top: 'Page top'
